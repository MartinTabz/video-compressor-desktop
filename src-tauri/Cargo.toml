[package]
name = "video-compressor"
version = "0.1.0"
description = "Video Kompresor — a friendly GUI wrapper around ffmpeg for the web"
authors = ["Marketing"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset serves extracted frames and the finished video into the
# webview through convertFileSrc; the scope is pinned in tauri.conf.json.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
